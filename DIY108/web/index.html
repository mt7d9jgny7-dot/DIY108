<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>RP2040 键盘配置中心</title>
    <!-- 🔥 修改路径为 css/style.css -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="sidebar">
        <div class="logo">RP2040 KB</div>
        <div class="menu-item active">设备</div>
        <div class="menu-item">固件</div>
        <div class="menu-item">设置</div>
        <div class="sidebar-footer">
            <button class="btn-connect" id="connectBtn">连接设备</button>
        </div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <div class="tab-group">
                <div class="tab-item active" id="keymap-tab-title" onclick="switchTab('keymap-tab')">自定义按键</div>
                <div class="tab-item" id="macro-tab-title" onclick="switchTab('macro-tab')">宏设置</div>
            </div>
            <span id="statusText" class="status-badge">未连接</span>
        </div>
        
        <div class="toolbar">
            <button class="btn-action btn-primary" id="readBtn" disabled>📥 读取设备</button>
            <button class="btn-action btn-success" id="writeBtn" disabled>💾 写入到设备</button>
            <div class="layer-switch" id="layerSwitch">
                <button class="layer-btn active" data-layer="0">普通层</button>
                <button class="layer-btn" data-layer="1">FN 层</button>
            </div>
        </div>

        <div class="view-container active" id="keymap-tab">
            <div class="keyboard-container">
                <div class="keyboard-board" id="keyboardBoard"></div>
            </div>
        </div>

        <div class="view-container" id="macro-tab">
            <div class="macro-container">
                <div class="macro-sidebar">
                    <h3>宏列表 (1-10)</h3>
                    <ul class="macro-list" id="macroList"></ul>
                </div>
                <div class="macro-editor">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h2 id="macroTitle" style="margin: 0;">编辑 宏 1</h2>
                        <button class="btn-action btn-primary" id="recordBtn" onclick="toggleMacroRecording()">🎙️ 开始录制</button>
                    </div>
                    <div class="action-list" id="actionList"></div>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn-action" onclick="addMacroAction('DOWN')">+ 按下键</button>
                        <button class="btn-action" onclick="addMacroAction('UP')">+ 抬起键</button>
                        <button class="btn-action" onclick="addMacroAction('DELAY')">+ 延迟(ms)</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="keyModal" class="modal">
        <div class="modal-content">
            <input type="text" id="keySearch" class="search-box" placeholder="搜索键码...">
            <div class="key-grid" id="keyGrid"></div>
        </div>
    </div>

    <!-- 🔥 修改路径，加上 js/ 前缀 -->
    <script src="js/config.js"></script>
    <script src="js/keycodes.js"></script>
    <script src="js/layout_data.js"></script>
    <script src="js/device_conn.js"></script>
    <script src="js/key_picker.js"></script>
    <script src="js/keyboard_ui.js"></script>
    <script src="js/macro_ui.js"></script>
    <script src="js/device_io.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
